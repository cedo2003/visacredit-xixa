# ── Visacredit XIXA — production (Dokploy) ───────────────────────────────────
#
# Déployé sur le MÊME serveur que epargne-africaVR, mais totalement séparé :
#
#   • application Dokploy distincte  → aucun conteneur partagé
#   • base MariaDB embarquée ici     → rien à créer dans l'interface Dokploy
#   • un seul port hôte publié       → 8090, le 8082 d'epargne reste intact
#   • réseau Docker PRIVÉ            → aucun alias DNS en commun avec epargne
#
# CE QUI EST EXPOSÉ : le frontend, et lui seul, sur http://<IP-DU-SERVEUR>:8090.
# Le backend et la base ne sont joignables que depuis le réseau interne Docker.
# C'est le montage d'epargne-africaVR (qui publie son frontend sur 8082), à ceci
# près que la base vit ici plutôt que dans l'interface Dokploy.
#
# POURQUOI LE BACKEND N'EST PAS PUBLIÉ : le navigateur ne parle qu'au frontend,
# qui relaie `/api` au backend par le réseau interne (frontend/next.config.ts).
# Une seule origine, donc aucun CORS — et une surface d'attaque réduite d'autant.
# L'application mobile, elle, est autonome : base SQLite embarquée, aucun appel
# serveur (voir mobile/src/lib/api.ts). Elle n'a rien à joindre ici.
#
# Dans Dokploy : Applications → Create → Compose, pointant sur ce dépôt. Aucun
# domaine à déclarer, aucune base à créer. Il suffit d'ouvrir le port 8090.

services:
  # ── Base de données ────────────────────────────────────────────────────────
  # MariaDB et non MySQL : boutiq.sql est un dump MariaDB 10.4, et le client
  # embarqué dans l'image du backend est `mariadb-client`. Face à un MySQL 8,
  # son authentification par défaut (caching_sha2_password) ferait échouer
  # l'import initial du schéma.
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    environment:
      MARIADB_DATABASE: visacredit
      MARIADB_USER: visacredit
      # `:?` fait échouer le déploiement si la variable manque, plutôt que de
      # créer silencieusement un compte sans mot de passe.
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?a saisir dans Dokploy}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?a saisir dans Dokploy}

    # Volume nommé : les données survivent aux redéploiements et aux
    # reconstructions d'image. Les supprimer efface la base.
    volumes:
      # Volume nomme : les donnees survivent aux redeploiements et aux
      # reconstructions d'image. Le supprimer efface la base.
      - visacredit-donnees:/var/lib/mysql

      # Import du schema et des donnees de demonstration, confie a MariaDB.
      #
      # L'image execute les fichiers .sql de ce dossier UNE SEULE FOIS, quand le
      # repertoire de donnees est vide, et AVANT d'accepter la moindre connexion.
      # C'est plus sur que de le faire depuis le backend : pas de course entre
      # les deux conteneurs, et un import qui echoue fait echouer la base --
      # visible tout de suite, au lieu d'une application qui demarre sans schema.
      - ./boutiq.sql:/docker-entrypoint-initdb.d/01-boutiq.sql:ro

    # Le backend importe le schéma dès son démarrage : il doit trouver une base
    # qui répond, pas seulement un conteneur lancé.
    healthcheck:
      # Le test reel est `healthcheck.sh`. Le compte de tables qui le precede
      # ne sert qu'a le faire apparaitre dans la sortie du healthcheck, que
      # `docker inspect` conserve : c'est le seul journal lisible par API sur
      # cette version de Dokploy, et il dit si boutiq.sql a bien ete importe.
      test: ["CMD-SHELL", "echo -n \"visacredit voit tables=\"; mariadb -h 127.0.0.1 -u visacredit -p$$MARIADB_PASSWORD -N -B -e \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='visacredit'\" 2>&1 | head -c 120; echo; healthcheck.sh --su-mysql --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

    networks: [visacredit]
    mem_limit: 512m

  # ── API Symfony ────────────────────────────────────────────────────────────
  backend:
    build:
      # Contexte à la racine : le Dockerfile a besoin de boutiq.sql, qui vit
      # au-dessus de backend/. Voir le commentaire en tête du Dockerfile.
      context: .
      dockerfile: backend/Dockerfile
    image: visacredit-backend:latest
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    # Dokploy écrit les variables saisies dans son interface vers un .env à la
    # racine (non versionné). Les valeurs sensibles ne vivent donc jamais ici.
    # Le gabarit complet à y coller est .env.example.
    env_file:
      - path: .env
        required: false

    environment:
      APP_ENV: "prod"
      APP_DEBUG: "0"
      # FrankenPHP écoute en HTTP simple, joint uniquement par le frontend.
      SERVER_NAME: ":80"
      # Défini ici et non dans le .env : l'hôte est le service `db` ci-dessus,
      # il n'y a rien à recopier à la main. `environment` prime sur `env_file`.
      # Le mot de passe ne doit contenir ni @ ni : ni / — docker-entrypoint.sh
      # découpe cette URL à la main.
      DATABASE_URL: "mysql://visacredit:${MYSQL_PASSWORD:?a saisir dans Dokploy}@db:3306/visacredit?serverVersion=10.11.11-MariaDB&charset=utf8mb4"

    # Publie la fin du journal de demarrage : `docker inspect` conserve la
    # sortie des healthchecks, seul journal lisible par API ici. Le conteneur
    # devient sain des que FrankenPHP repond, quel que soit le code HTTP -- un
    # 404 sur `/` est normal, l'API n'a pas de route racine.
    healthcheck:
      test: ["CMD-SHELL", "tail -c 400 /tmp/entrypoint.log 2>&1; curl -sS -o /dev/null http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 90s

    networks: [visacredit]
    mem_limit: 512m

  # ── Interface web (Next.js) ────────────────────────────────────────────────
  frontend:
    build:
      # Contexte frontend/ — le build Next n'a besoin de rien au-dessus.
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Figé dans le bundle au build : le modifier demande un *Deploy*, pas un
        # simple redémarrage. Interpolé depuis le .env écrit par Dokploy.
        NEXT_PUBLIC_LIEN_APK: ${NEXT_PUBLIC_LIEN_APK:-}
    image: visacredit-frontend:latest
    restart: unless-stopped

    depends_on: [backend]

    environment:
      NODE_ENV: "production"
      # server.js doit écouter sur toutes les interfaces pour être joignable
      # depuis l'extérieur du conteneur.
      HOSTNAME: "0.0.0.0"
      PORT: "3000"

    # Publié directement sur l'hôte → http://<IP-DU-SERVEUR>:8090, sans passer
    # par Traefik. 8090 évite le 3000 de Dokploy, le 8082 d'epargne et les
    # 80/443 de Traefik. À ouvrir dans le pare-feu / groupe de sécurité.
    ports:
      - "8090:3000"

    networks: [visacredit]
    mem_limit: 512m

volumes:
  # Renomme volontairement : l'ancien `visacredit-db` avait ete initialise sans
  # le script d'import ci-dessus, et MariaDB ne rejoue jamais l'initialisation
  # sur un volume deja peuple. Un nom neuf garantit un premier demarrage propre.
  visacredit-donnees:

networks:
  # Reseau PRIVE au projet, et c'est tout l'enjeu.
  #
  # Sur le `dokploy-network` partage, chaque service expose son nom comme alias
  # DNS. epargne-africaVR ayant lui aussi un service nomme `backend`, l'alias
  # etait porte par DEUX conteneurs : `http://backend` resolvait vers l'un ou
  # l'autre, et notre frontend interrogeait l'API Symfony d'epargne -- qui
  # repondait 404 sur nos routes, 401 sur les siennes, et 500 a la connexion.
  # Une panne parfaitement deroutante : les reponses avaient la bonne allure
  # (FrankenPHP, PHP 8.3, JSON d'erreur Symfony), elles venaient juste de la
  # mauvaise application.
  #
  # Ici, `backend` et `db` ne designent que nos conteneurs. Le jour ou un
  # domaine remplacera le port 8090, il faudra rattacher le service `frontend`
  # a `dokploy-network` EN PLUS de celui-ci, pour que Traefik puisse l'atteindre
  # -- et lui donner alors un alias explicite, distinct de `frontend`.
  visacredit:
    driver: bridge
